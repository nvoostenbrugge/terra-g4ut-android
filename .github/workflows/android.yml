name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Python 3.12 (buildPython voor Chaquopy)
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TerraG4UT-${GITHUB_REF_NAME//\//-}.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: TerraG4UT-apk
          path: TerraG4UT-*.apk

      - name: Release "latest" (elke push naar main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Terra G4UT — laatste build
          body: "Automatisch gebouwd van commit ${{ github.sha }}. Download de APK hieronder en installeer op de tablet."
          prerelease: true
          files: TerraG4UT-*.apk

      - name: Release (bij tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TerraG4UT-*.apk
